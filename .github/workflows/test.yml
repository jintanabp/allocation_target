name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      # ต้องผ่าน run_tests.py ไม่ใช่ unittest ตรง ๆ — ตัวนี้ติดตั้งกันชนสองอย่างให้ก่อนรัน
      #   1. กันเทสต์เขียนทับไฟล์ config จริง (เคยเจอ app_runtime.json เปลี่ยนเองกลางรัน)
      #   2. กันเทสต์ยิงเน็ตขึ้นระบบจริงของบริษัท
      - name: Run unit tests
        run: python run_tests.py -v

  # app.js เป็นไฟล์ UI ล้วน รันในเทสไม่ได้ — กันได้แค่ syntax + ReferenceError
  # (เคยหลุด: ลบ `const readOnly = ...` แต่ลืม `if (!readOnly)` → ผลกระจายไม่ขึ้นทั้งหน้า)
  # ส่วนตรรกะที่ "คำนวณผิดแล้วเงียบ" ถูกแยกไป frontend/logic.js ซึ่งมีเทสจริง
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check frontend/logic.js
          node --check frontend/app.js
      - name: เทสตรรกะหน้าเว็บ (ตัวแปลงเลข + คณิตการเกลี่ยหีบ)
        run: node --test tests/logic.test.js
      - name: ตรวจตัวแปรที่ใช้แต่ไม่เคยประกาศ
        run: |
          npm install --no-save --no-audit --no-fund acorn
          node scripts/dev/check_js_undef.js frontend/logic.js
          node scripts/dev/check_js_undef.js frontend/app.js
