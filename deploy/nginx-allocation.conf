# nginx reverse proxy (HTTPS) หน้า uvicorn
# install.sh แทน __DOMAIN__ แล้ววางที่ /etc/nginx/sites-available/allocation
#
# Cert: วางไฟล์จาก IT ที่ /etc/ssl/alloc/fullchain.pem + privkey.pem
# ถ้าใช้ Let's Encrypt: รัน `sudo certbot --nginx -d __DOMAIN__` แล้ว certbot แก้ path ให้เอง

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/ssl/alloc/fullchain.pem;
    ssl_certificate_key /etc/ssl/alloc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # อัปโหลด Excel (นำเข้าเป้า / สิทธิ์) — ค่าเริ่มต้น nginx 1 MB ไม่พอ
    client_max_body_size 50m;

    # คำนวณกระจายหีบทั้งภาค / ส่ง Target Sun ใช้เวลาได้หลายนาที — ค่าเริ่มต้น 60s จะตัดกลางทาง (504)
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
